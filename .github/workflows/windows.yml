name: Public Windows CI
on:
  push:
    branches: [YAPAY_ZEKA]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked public dependencies
        run: dotnet restore SapMcpManager.slnx --locked-mode
      - name: Build public source
        run: dotnet build SapMcpManager.slnx -c Release --no-restore
      - name: Unit and bilingual headless UI tests (no SAP or private payload)
        run: dotnet test SapMcpManager.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Scan public sources
        run: ./scripts/Test-Publication.ps1 -SourceOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-windows-test-results
          path: artifacts/test-results
